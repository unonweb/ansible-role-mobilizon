---
# INSTALL
# =======
mobilizon_user: mobilizon
mobilizon_install_opt_from: url
mobilizon_install_opt_url: https://packages.mobilizon.org/latest-package
# https://packages.mobilizon.org/5.2.4/mobilizon_5.2.4_debian-bookworm_amd64.tar.gz

# DIRS
# ====
mobilizon_dir_app: /opt/mobilizon
mobilizon_dir_config: /etc/mobilizon
mobilizon_dir_upload: /var/lib/mobilizon/uploads
mobilizon_dir_data: /var/lib/mobilizon/data # not used

# DB
# ==
mobilizon_db_user: ""
mobilizon_db_user_pw: ""
mobilizon_db_name: ""

# CONFIG
# ======
mobilizon_config_domain:
mobilizon_config_instance_name: "{{ inventory_hostname }}"
mobilizon_config_description: "Mobilizon instance for {{ mobilizon_config_domain }}"
mobilizon_config_port: 4000
mobilizon_config_secret_key_base: ""
mobilizon_config_secret_key: ""
mobilizon_config_mail_from: "{{ inventory_hostname }}"
mobilizon_config_mail_to: ""
mobilizon_config_mail_server: ""
mobilizon_config_mail_port: 25
mobilizon_config_mail_username: ""
mobilizon_config_mail_password: ""

# SERVICE
# =======
mobilizon_systemd_units:
- name: mobilizon.service
  type: service
  state: started
  enabled: true
  template: systemd-mobilizon-release.service.j2