---
- tags: [role-mobilizon-install]
  block:

  # assert
  - name: Assertions for mobilizon-install
    ansible.builtin.assert:
      that:
      - mobilizon_user != ""
      - mobilizon_dir_app != ""
      - mobilizon_install_opt_from != ""
      quiet: true

  # install
  - name: Install required packages
    become: true
    ansible.builtin.apt:
      state: present
      install_recommends: false
      name:
      - curl
      - tar
      - imagemagick
      - file
      # optional
      - gifsicle
      - jpegoptim
      - optipng
      - pngquant

  # create linux user
  - name: Create system user {{ mobilizon_user }}
    become: true
    ansible.builtin.user:
      create_home: true
      home: "{{ mobilizon_dir_app }}"
      system: true
      shell: /bin/false
      password_lock: true
      name: "{{ mobilizon_user }}"

  # mkdir app
  - name: Mkdir {{ mobilizon_dir_app }}
    become: true
    ansible.builtin.file:
      state: directory
      path: "{{ mobilizon_dir_app }}"
      owner: "{{ mobilizon_user }}"
      group: "{{ mobilizon_user }}"
      mode: u=rwx,g=,o=

  # install from url
  - when: mobilizon_install_opt_from == "url"
    block:

    # assertions
    - name: Assertions for mobilizon-install
      ansible.builtin.assert:
        that:
        - mobilizon_install_opt_url != ""

    - name: Install from url to {{ mobilizon_dir_app }}
      become: true
      ansible.builtin.unarchive:
        src: "{{ mobilizon_install_opt_url }}"
        dest: "{{ mobilizon_dir_app }}"
        remote_src: true
        owner: "{{ mobilizon_user }}"
        group: "{{ mobilizon_user }}"
        mode: u=rwx,g=rx,o=rx