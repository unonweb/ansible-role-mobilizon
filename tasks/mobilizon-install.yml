---
- tags: [role-mobilizon-install]
  block:

  # assert
  - name: Assertions for mobilizon-install
    ansible.builtin.assert:
      that:
      - mobilizon_user | length > 0
      - mobilizon_dir_app | length > 0
      - mobilizon_dir_config | length > 0
      - mobilizon_dir_upload | length > 0
      - mobilizon_dir_data | length > 0
      - mobilizon_install_opt_from | length > 0
      quiet: true

  # install
  - name: Install required packages
    become: true
    ansible.builtin.apt:
      state: present
      install_recommends: false
      name:
      - curl
      - tar
      - imagemagick
      - file
      # optional
      - gifsicle
      - jpegoptim
      - optipng
      - pngquant

  # create linux user
  - name: Create system user {{ mobilizon_user }}
    become: true
    ansible.builtin.user:
      create_home: true
      home: "{{ mobilizon_dir_app }}"
      system: true
      shell: /bin/false
      password_lock: true
      name: "{{ mobilizon_user }}"

  # mkdir config
  - name: Mkdir {{ mobilizon_dir_config }}
    become: true
    ansible.builtin.file:
      state: directory
      path: "{{ mobilizon_dir_config }}"
      owner: "{{ mobilizon_user }}"
      group: "{{ mobilizon_user }}"
      mode: u=rwx,g=rx,o=rx

  # mkdir upload
  - name: Mkdir {{ mobilizon_dir_upload }}
    become: true
    ansible.builtin.file:
      state: directory
      path: "{{ mobilizon_dir_upload }}"
      owner: "{{ mobilizon_user }}"
      group: "{{ mobilizon_user }}"
      mode: u=rwx,g=rx,o=rx

  # mkdir csv exports
  - name: Mkdir {{ mobilizon_dir_upload }}/exports/csv
    become: true
    ansible.builtin.file:
      state: directory
      path: "{{ mobilizon_dir_upload }}exports/csv"
      owner: "{{ mobilizon_user }}"
      group: "{{ mobilizon_user }}"
      mode: u=rwx,g=rx,o=rx

  # mkdir data
  - name: Mkdir {{ mobilizon_dir_data }}
    become: true
    ansible.builtin.file:
      state: directory
      path: "{{ mobilizon_dir_data }}"
      owner: "{{ mobilizon_user }}"
      group: "{{ mobilizon_user }}"
      mode: u=rwx,g=rx,o=rx

  # install from url
  - when: mobilizon_install_opt_from == "url"
    block:

    # assertions
    - name: Assertions
      ansible.builtin.assert:
        that:
        - mobilizon_install_opt_url | length > 0

    - name: Install from url to {{ mobilizon_dir_app }}
      become: true
      ansible.builtin.unarchive:
        src: "{{ mobilizon_install_opt_url }}"
        dest: "{{ mobilizon_dir_app | dirname }}"
        remote_src: true
        owner: "{{ mobilizon_user }}"
        group: "{{ mobilizon_user }}"
        mode: u=rwx,g=rx,o=rx