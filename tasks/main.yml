---
- name: mobilizon role
  tags: [role-mobilizon]
  block:

  # install
  - ansible.builtin.import_tasks: mobilizon-install.yml

  # config
  - ansible.builtin.import_tasks: mobilizon-config.yml

  # systemd_unit
  - name: Configure systemd units
    ansible.builtin.include_tasks: mobilizon-systemd-unit.yml
    loop: "{{ mobilizon_systemd_units }}"
    loop_control:
      loop_var: item
      label: "{{ item.name }}"