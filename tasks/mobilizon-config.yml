---
- tags: [role-mobilizon-config]
  block:

  # assert
  - name: Assertions for mobilizon-config
    ansible.builtin.assert:
      that:
      - mobilizon_db_user | length > 0
      - mobilizon_db_user_pw | length > 0
      - mobilizon_db_name | length > 0
      - mobilizon_config_mail_to | length > 0
      - mobilizon_config_mail_server | length > 0
      - mobilizon_config_mail_hostname | length > 0
      - mobilizon_config_mail_port != None
      - mobilizon_config_mail_username | length > 0
      - mobilizon_config_mail_password | length > 0
      - mobilizon_config_secret_key_base | length > 0
      - mobilizon_config_secret_key | length > 0
      - mobilizon_config_domain | length > 0
      quiet: true

  # template
  - name: Template config file config.exs.j2
    ansible.builtin.template:
      src: config.exs.j2
      dest: "{{ mobilizon_dir_config }}/config.exs"
      owner: mobilizon
      group: mobilizon
      mode: u=rw,g=,o=